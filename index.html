<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Drawn by scripts/generate-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/masked-icon.svg" color="#ff3b30" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f0" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      No web font CDN. Fraunces, Source Serif 4 and Inter Tight are self-hosted
      from /fonts and precached by the service worker, because a kitchen with
      no signal is the scene this was built for.
    -->
    <title>Proof</title>
    <script>
      (function() {
        try {
          // Paper is the default; keep in step with src/lib/theme.ts.
          var theme = localStorage.getItem('theme');
          var dark = theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      The service worker is registered by vite-plugin-pwa (registerType: 'autoUpdate').
      A second manual navigator.serviceWorker.register('/sw.js') here used to run
      alongside it and bypassed the plugin's update flow.
    -->
  </body>
</html>
