<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The step row, drawn by scripts/generate-icons.mjs from the design
         tokens. The previous icon was a gold chef's hat from the Black & Gold
         world this design replaced. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/masked-icon.svg" color="#ff3b30" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      No web font CDN. Archivo and JetBrains Mono are self-hosted from /fonts
      and precached by the service worker, because a kitchen with no signal is
      the scene this was built for. Inter was still being fetched from Google
      Fonts on every load here, for a face the design system does not use.
    -->
    <title>Proof</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            // Dark is the default
            document.documentElement.classList.add('dark');
          }
          var font = localStorage.getItem('fontFamily');
          document.documentElement.setAttribute('data-font', font || 'sans');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      The service worker is registered by vite-plugin-pwa (registerType: 'autoUpdate').
      A second manual navigator.serviceWorker.register('/sw.js') here used to run
      alongside it and bypassed the plugin's update flow.
    -->
  </body>
</html>
